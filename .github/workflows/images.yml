name: images

# The official sandbox images. They are the product's other half: the API knows only
# image + cmd + env (DESIGN.md decision 20), so what a sandbox *is* lives in one of these.
# A pull request builds them; main and dev publish them to GHCR, which is what lets a
# fresh worker run a preset without anyone having built anything locally.
on:
  push:
    branches: [main, dev]
    tags: ["v*"]
    paths: ["images/**", ".github/workflows/images.yml"]
  pull_request:
    paths: ["images/**", ".github/workflows/images.yml"]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # The entry and every agent file are shell that only ever runs inside a container, so a
  # syntax error would otherwise be found by a user, in a PTY, halfway through a clone.
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: syntax
        run: find images -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: shellcheck
        run: find images -name '*.sh' -print0 | xargs -0 shellcheck -S warning -e SC1091

  build:
    needs: shell
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [agent, vscode, jupyter]
    steps:
      - uses: actions/checkout@v4
      # The fleet is Graviton (t4g) with no binfmt of its own, and this runner is amd64:
      # without qemu here the arm64 half of the matrix below cannot be built at all.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # A pull request from a fork has no package write, and publishing an unreviewed
      # image would be the wrong thing anyway: build it, prove the Dockerfile, stop there.
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` follows the default branch (`dev` today), because that is the tag every
      # examples/ui/presets/*/preset.yaml names and a preset has to resolve to something
      # that exists. The cost is real and deliberate: a push to the default branch moves
      # what every worker pulls on its next miss. Pin a `sha-` tag in a preset to opt out.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/sandboxd-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      # Both architectures, always: the workers are arm64 and an amd64-only manifest gets
      # as far as `running` there before the entry fails to exec (DESIGN.md decision 15).
      - uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
