name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Go is the product; sdk/typescript and examples/ui are clients of a documented API and
# gate only themselves. Both generated trees are checked in and both jobs regenerate and
# diff, so `api/client.yaml` and what comes out of it can only be in step.
jobs:
  # `golangci-lint fmt --diff` is the gofumpt check, so the formatter is pinned by the
  # linter and not installed twice.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # internal/gen is checked in so a build needs no
      # generator. ogen is a `tool` in go.mod, so this needs nothing installed — and the
      # version is pinned there, which is what makes the diff below mean anything.
      - name: generated servers are current
        run: go generate ./... && git diff --exit-code internal/gen
      - run: go build ./...
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout=5m
      - name: gofumpt
        run: golangci-lint fmt --diff
      - run: go test -race ./...

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      # src/generated is checked in so a consumer needs no codegen. Regenerating it from
      # ../../api/client.yaml must be a no-op, or the client and the contract have drifted.
      - name: generated output is current
        run: bun run generate && git diff --exit-code src/generated

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/ui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # src/admin is this app's own generated client for api/admin.yaml — the fleet has no
      # published SDK, so the one client that wants it generates it here (decision 27).
      - name: generated admin client is current
        run: bun run generate && git diff --exit-code src/admin
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
