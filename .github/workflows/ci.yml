name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Go is the product; examples/ui is a client of a documented API and gates only itself.
jobs:
  # `golangci-lint fmt --diff` is the gofumpt check, so the formatter is pinned by the
  # linter and not installed twice.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout=5m
      - name: gofumpt
        run: golangci-lint fmt --diff
      - run: go test -race ./...

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/ui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
