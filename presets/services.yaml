# Service catalog: sidecars a session can pick by name (`services: ["postgres"]`).
# This is an ordinary compose file, so `docker compose -f presets/services.yaml up`
# runs the same containers locally. The control plane keeps the subset the daemon
# can run (image, environment, command, expose → readiness port, depends_on) and
# reads the `x-sandboxd` extension:
#   ready:       {port, timeout_s?}  TCP port the daemon waits on before starting the sandbox
#   sandbox_env: {NAME: value}       env injected into the sandbox when this service is included
#   secret_env:  {NAME: value}       env for the service that must never be persisted
# Passwords here are for throwaway per-session databases; they are not secrets.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sandboxd
      POSTGRES_PASSWORD: sandboxd
      POSTGRES_DB: app
    expose: ["5432"]
    x-sandboxd:
      ready: { port: 5432, timeout_s: 90 }
      sandbox_env:
        DATABASE_URL: postgres://sandboxd:sandboxd@postgres:5432/app
        PGHOST: postgres
        PGPORT: "5432"
        PGUSER: sandboxd
        PGPASSWORD: sandboxd
        PGDATABASE: app
  redis:
    image: redis:7-alpine
    expose: ["6379"]
    x-sandboxd:
      ready: { port: 6379 }
      sandbox_env:
        REDIS_URL: redis://redis:6379
