# vscode: VS Code in the browser (code-server) on a repo, editor only. Preview it on `port`.
# Idle defaults to 4 h because preview traffic does not count as activity (design decision 10).
description: VS Code (code-server) on a repo, behind the preview proxy
idle_timeout_s: 14400
preview: { port_field: port }
fields:
  repo: { type: string, env: REPO, description: "optional, cloned into /workspace" }
  port: { type: int, min: 1, max: 65535, default: 8080, env: VSCODE_PORT }
  secrets.git_token: { type: string, secret: true, env: GIT_TOKEN, description: "for private repos / push" }
