# notebook: JupyterLab on the stock docker-stacks image, no Dockerfile. Same server flags
# as the jupyter preset's entry (auth off: the preview cookie is the gate; allow_origin=*
# because the proxy rewrites Host), minus the repo clone — use `jupyter` for that.
description: JupyterLab on the stock docker-stacks image, behind the preview proxy
image: quay.io/jupyter/minimal-notebook:latest
cmd:
  - jupyter
  - lab
  - --ip=0.0.0.0
  - --port=8888
  - --no-browser
  - --IdentityProvider.token=
  - --ServerApp.password=
  - --ServerApp.allow_remote_access=True
  - --ServerApp.allow_origin=*
  - --ServerApp.trust_xheaders=True
idle_timeout_s: 14400
preview: { port: 8888 }
